spring.application.name=saree-manager

# --- DATABASE CONFIGURATION ---
# Uses MySQL if SPRING_DATASOURCE_URL exists (Production), otherwise falls back to H2 (Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
# Dynamically switches dialect based on the environment
# Change this one line
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
# --- AI & EXTERNAL SERVICES ---
# Your custom property used in OcrService/ChatService
gemini.api.key=${GEMINI_API_KEY:AIzaSyC5tc7WKXu2sYsWsT5eHCGLdOMD3U4rfbk}

# Cloudinary Config
cloudinary.cloud.name=${CLOUDINARY_NAME:dli2e4jra}
cloudinary.api.key=${CLOUDINARY_KEY:691147127432635}
cloudinary.api_secret=${CLOUDINARY_SECRET:2Fqpebdk7O3C7zwkYFcxYcxycWQ}

# --- SECURITY ---
# Used in your SecurityConfig.java
app.admin.username=${APP_ADMIN_USER:root}
app.admin.password=${APP_ADMIN_PASS:admin123}

# Default Spring Security (Good to keep as backup)
spring.security.user.name=${APP_ADMIN_USER:root}
spring.security.user.password=${APP_ADMIN_PASS:admin123}

# --- FILE UPLOAD LIMITS ---
# Important for uploading high-quality bill images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB